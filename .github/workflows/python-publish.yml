# Publishes mcp-etf-holdings to PyPI when a GitHub Release is published.
#
# Uses PyPI trusted publishing (OIDC) — no API token secret is stored in this repo.
# This requires a matching publisher registered at pypi.org → Publishing:
#   project `mcp-etf-holdings`, owner `vlearner`, repo `mcp-etf-holdings`,
#   workflow `python-publish.yml`, environment `pypi`.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Verify the wheel has no top-level `src/`
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          bad = [n for n in names if n.startswith("src/")]
          if bad:
              sys.exit(f"Wheel ships a top-level src/ package: {bad[:5]}")
          print(f"OK: {wheel} has no top-level src/")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/mcp-etf-holdings

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
