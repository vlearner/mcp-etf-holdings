# Publishes mcp-etf-holdings to PyPI, then lists it on the MCP Registry, when a
# GitHub Release is published. The release tag (vX.Y.Z) must match server.json.
#
# Uses PyPI trusted publishing (OIDC) — no API token secret is stored in this repo.
# This requires a matching publisher registered at pypi.org → Publishing:
#   project `mcp-etf-holdings`, owner `vlearner`, repo `mcp-etf-holdings`,
#   workflow `python-publish.yml`, environment `pypi`.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Verify the wheel has no top-level `src/`
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          bad = [n for n in names if n.startswith("src/")]
          if bad:
              sys.exit(f"Wheel ships a top-level src/ package: {bad[:5]}")
          print(f"OK: {wheel} has no top-level src/")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/mcp-etf-holdings

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  registry-publish:
    # Lists the release on the official MCP Registry. Runs only after PyPI has the
    # version, because the registry verifies the package exists and carries the
    # `mcp-name` marker in its README. Authenticates with GitHub OIDC (no secret);
    # that is what makes the `io.github.vlearner/*` namespace publishable.
    runs-on: ubuntu-latest
    needs:
      - pypi-publish
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Check server.json matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          tag = os.environ["TAG"].removeprefix("v")
          server = json.load(open("server.json"))
          versions = {server["version"], *(p["version"] for p in server["packages"])}
          if versions != {tag}:
              sys.exit(f"server.json versions {sorted(versions)} do not match release {tag}")
          print(f"OK: server.json is {tag}")
          PY

      - name: Wait for PyPI to serve the new version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          for i in $(seq 1 24); do
            if curl -fsS "https://pypi.org/pypi/mcp-etf-holdings/${version}/json" >/dev/null; then
              echo "PyPI has ${version}"; exit 0
            fi
            sleep 5
          done
          echo "PyPI never served ${version}" >&2; exit 1

      - name: Install mcp-publisher (pinned, checksum-verified)
        env:
          VERSION: v1.8.1
          SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
