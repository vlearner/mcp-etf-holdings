
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-etf-holdings"
version = "0.3.0"
description = "MCP server for ETF reverse lookup — find which ETFs hold any stock"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "mcp-etf-holdings contributors" },
]
keywords = ["mcp", "etf", "stocks", "finance", "yfinance", "model-context-protocol"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial :: Investment",
  "Intended Audience :: Developers",
]
dependencies = [
  "mcp>=1.0.0",
  "yfinance>=0.2.40",
  "pandas>=2.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "pytest-mock>=3.10",
  "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/vlearner/mcp-etf-holdings"
"Bug Tracker" = "https://github.com/vlearner/mcp-etf-holdings/issues"

[project.scripts]
# Primary name matches the distribution so bare `uvx mcp-etf-holdings` resolves.
mcp-etf-holdings = "mcp_etf_holdings.server:main"
# Back-compat alias for configs written against 0.2.x.
etf-holdings-server = "mcp_etf_holdings.server:main"

[tool.setuptools.packages.find]
where = ["src"]
